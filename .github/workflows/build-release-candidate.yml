name: Build (JAR + client pack)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JAR and Client Pack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Smoke test dev server
        run: python3 tools/smoke_dev_server.py

      - name: Build Modrinth client pack
        shell: bash
        run: |
          VERSION="$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one release JAR, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          python3 scripts/build_modrinth_pack.py --version "$VERSION" --jar "${jars[0]}" --output "dist/blood-on-the-sharktower-${VERSION}.mrpack"

      - name: List build outputs
        if: always()
        run: |
          find build/libs -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || true
          find dist -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || true

      - name: Upload server JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blood-on-the-sharktower-server
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload Modrinth client pack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blood-on-the-sharktower-client
          path: dist/*.mrpack
          if-no-files-found: error
          retention-days: 30
