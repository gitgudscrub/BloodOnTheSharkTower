name: Build / Publish Modrinth Pack

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable modpack version (for example 1.1.0)"
        required: true
        type: string
      changelog:
        description: "Player-facing release notes"
        required: false
        default: "Blood on the Sharktower update."
        type: string
      version_type:
        description: "Modrinth release channel"
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      publish_to_modrinth:
        description: "Publish after building (leave off for a safe dry run)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  modrinth-pack:
    name: Build Modrinth Pack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 1.1.0, 1.1.0-beta.1, etc."
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build stable Sharktower JAR
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace -Pversion="${{ inputs.version }}"

      - name: Locate release JAR
        id: jar
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one release JAR, found ${#jars[@]}:"
            printf '  %s\n' "${jars[@]}"
            exit 1
          fi
          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"
          echo "Using ${jars[0]}"

      - name: Build .mrpack
        run: |
          python3 scripts/build_modrinth_pack.py \
            --version "${{ inputs.version }}" \
            --jar "${{ steps.jar.outputs.path }}" \
            --output "dist/blood-on-the-sharktower-${{ inputs.version }}.mrpack"

      - name: Inspect pack contents
        run: |
          unzip -l "dist/blood-on-the-sharktower-${{ inputs.version }}.mrpack"
          unzip -p "dist/blood-on-the-sharktower-${{ inputs.version }}.mrpack" modrinth.index.json | python3 -m json.tool

      - name: Upload dry-run / release artifact
        uses: actions/upload-artifact@v4
        with:
          name: blood-on-the-sharktower-${{ inputs.version }}-mrpack
          path: dist/blood-on-the-sharktower-${{ inputs.version }}.mrpack
          if-no-files-found: error
          retention-days: 30

      - name: Validate Modrinth publishing configuration
        if: ${{ inputs.publish_to_modrinth }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "Missing GitHub Actions secret: MODRINTH_TOKEN"
            exit 1
          fi
          if [ -z "$MODRINTH_PROJECT_ID" ]; then
            echo "Missing GitHub Actions repository variable: MODRINTH_PROJECT_ID"
            exit 1
          fi

      - name: Publish version to Modrinth
        if: ${{ inputs.publish_to_modrinth }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANGELOG: ${{ inputs.changelog }}
          RELEASE_TYPE: ${{ inputs.version_type }}
        shell: bash
        run: |
          DATA="$(jq -n \
            --arg project "$MODRINTH_PROJECT_ID" \
            --arg version "$RELEASE_VERSION" \
            --arg changelog "$RELEASE_CHANGELOG" \
            --arg version_type "$RELEASE_TYPE" \
            '{
              name: ("Blood on the Sharktower " + $version),
              version_number: $version,
              changelog: $changelog,
              dependencies: [],
              game_versions: ["26.3"],
              version_type: $version_type,
              loaders: ["fabric"],
              featured: true,
              status: "listed",
              project_id: $project,
              file_parts: ["pack"],
              primary_file: "pack",
              environment: "client_and_server"
            }')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "User-Agent: gitgudscrub/BloodOnTheSharkTower (GitHub Actions)" \
            --form "data=$DATA;type=application/json" \
            --form "pack=@dist/blood-on-the-sharktower-${RELEASE_VERSION}.mrpack;type=application/x-modrinth-modpack+zip" \
            https://api.modrinth.com/v2/version \
            | tee modrinth-response.json

          echo
          echo "Published Modrinth version:"
          jq '{id, project_id, name, version_number, version_type, status, date_published}' modrinth-response.json
