name: Build / Publish Modrinth Pack

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-modrinth.yml'
      - 'scripts/build_modrinth_pack.py'
      - 'modrinth/**'
  workflow_dispatch:
    inputs:
      version:
        description: "Stable modpack version (for example 1.1.0)"
        required: true
        type: string
      changelog:
        description: "Player-facing release notes"
        required: false
        default: "Blood on the Sharktower update."
        type: string
      version_type:
        description: "Modrinth release channel"
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      publish_to_modrinth:
        description: "Publish after building (leave off for a safe dry run)"
        required: true
        default: false
        type: boolean
      publish_auto_update:
        description: "Push this version to the Prism auto-update pack (GitHub release + pack branch)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.0.0-ci' }}
  # Auto-update pack (docs/AUTO_UPDATE.md). The Prism instance only knows
  # PACK_URL; each release's JAR is a GitHub release asset under pack-<version>.
  PACK_URL: https://raw.githubusercontent.com/${{ github.repository }}/pack/pack.toml
  JAR_URL_BASE: https://github.com/${{ github.repository }}/releases/download
  BOOTSTRAP_URL: https://github.com/packwiz/packwiz-installer-bootstrap/releases/download/v0.0.3/packwiz-installer-bootstrap.jar
  BOOTSTRAP_SHA256: a8fbb24dc604278e97f4688e82d3d91a318b98efc08d5dbfcbcbcab6443d116c

jobs:
  modrinth-pack:
    name: Build Modrinth Pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Only used by the opt-in "publish_auto_update" steps (release + pack branch).
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 1.1.0, 1.1.0-beta.1, etc."
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build stable Sharktower JAR
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace -Pversion="$RELEASE_VERSION"

      - name: Locate release JAR
        id: jar
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one release JAR, found ${#jars[@]}:"
            printf '  %s\n' "${jars[@]}"
            exit 1
          fi
          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"
          echo "Using ${jars[0]}"

      - name: Prepare server JAR
        run: |
          mkdir -p dist/server
          cp "${{ steps.jar.outputs.path }}" "dist/server/blood-on-the-sharktower-${RELEASE_VERSION}.jar"

      - name: Download packwiz-installer-bootstrap (pinned)
        run: |
          curl --fail --silent --show-error --location -o packwiz-installer-bootstrap.jar "$BOOTSTRAP_URL"
          echo "$BOOTSTRAP_SHA256  packwiz-installer-bootstrap.jar" | sha256sum --check

      - name: Build .mrpack, auto-update pack and Prism instance
        run: |
          python3 scripts/build_modrinth_pack.py \
            --version "$RELEASE_VERSION" \
            --jar "${{ steps.jar.outputs.path }}" \
            --output "dist/blood-on-the-sharktower-${RELEASE_VERSION}.mrpack" \
            --packwiz-out dist/packwiz \
            --jar-url "$JAR_URL_BASE/pack-${RELEASE_VERSION}/blood-on-the-sharktower-${RELEASE_VERSION}.jar" \
            --prism-out dist/Blood-on-the-Sharktower-Prism.zip \
            --pack-url "$PACK_URL" \
            --bootstrap packwiz-installer-bootstrap.jar

      - name: Inspect pack contents
        shell: bash
        run: |
          PACK="dist/blood-on-the-sharktower-${RELEASE_VERSION}.mrpack"
          unzip -l "$PACK"
          unzip -p "$PACK" modrinth.index.json | python3 -m json.tool
          python3 - "$PACK" <<'PY'
          import sys
          import zipfile

          pack = sys.argv[1]
          with zipfile.ZipFile(pack) as archive:
              data = archive.read("overrides/servers.dat")
          if not data:
              raise SystemExit("servers.dat is empty")
          if data[0] != 0x0A:
              raise SystemExit(
                  f"servers.dat must be raw NBT beginning with TAG_Compound 0x0A; found 0x{data[0]:02X}"
              )
          print("servers.dat raw NBT header validated: 0x0A")
          PY

      - name: Upload client modpack artifact
        uses: actions/upload-artifact@v4
        with:
          name: blood-on-the-sharktower-${{ env.RELEASE_VERSION }}-mrpack
          path: dist/blood-on-the-sharktower-${{ env.RELEASE_VERSION }}.mrpack
          if-no-files-found: error
          retention-days: 30

      - name: Upload server JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: blood-on-the-sharktower-${{ env.RELEASE_VERSION }}-server
          path: dist/server/blood-on-the-sharktower-${{ env.RELEASE_VERSION }}.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload auto-update pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: blood-on-the-sharktower-${{ env.RELEASE_VERSION }}-autoupdate
          path: |
            dist/packwiz
            dist/Blood-on-the-Sharktower-Prism.zip
          if-no-files-found: error
          retention-days: 30

      # The release must exist before the pack branch points players at its JAR.
      - name: Publish auto-update release (JAR + Prism instance)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_auto_update }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANGELOG: ${{ inputs.changelog }}
        run: |
          # A fixed name so releases/latest/download/Blood-on-the-Sharktower.mrpack
          # always gets the newest pack (linked from the website's Get the pack page).
          cp "dist/blood-on-the-sharktower-${RELEASE_VERSION}.mrpack" dist/Blood-on-the-Sharktower.mrpack
          gh release create "pack-${RELEASE_VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Blood on the Sharktower ${RELEASE_VERSION}" \
            --notes "$RELEASE_CHANGELOG" \
            --latest \
            "dist/server/blood-on-the-sharktower-${RELEASE_VERSION}.jar" \
            dist/Blood-on-the-Sharktower-Prism.zip \
            dist/Blood-on-the-Sharktower.mrpack

      - name: Point the auto-update pack at this version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_auto_update }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir pack-branch
          cd pack-branch
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin pack; then
            git checkout -q -B pack FETCH_HEAD
          else
            git checkout -q --orphan pack
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../dist/packwiz/. .
          printf '%s\n' \
            "# Blood on the Sharktower auto-update pack" \
            "" \
            "Generated by the publish workflow; do not edit by hand." \
            "Prism instances read pack.toml from this branch on every launch." \
            "See docs/AUTO_UPDATE.md on main." > README.md
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Pack ${RELEASE_VERSION}"
          git push -q origin pack
          echo "Auto-update pack now serves ${RELEASE_VERSION} at $PACK_URL"

      - name: Validate Modrinth publishing configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_modrinth }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "Missing GitHub Actions secret: MODRINTH_TOKEN"
            exit 1
          fi
          if [ -z "$MODRINTH_PROJECT_ID" ]; then
            echo "Missing GitHub Actions repository variable: MODRINTH_PROJECT_ID"
            exit 1
          fi

      - name: Publish version to Modrinth
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_modrinth }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          RELEASE_CHANGELOG: ${{ inputs.changelog }}
          RELEASE_TYPE: ${{ inputs.version_type }}
        shell: bash
        run: |
          DATA="$(jq -n \
            --arg project "$MODRINTH_PROJECT_ID" \
            --arg version "$RELEASE_VERSION" \
            --arg changelog "$RELEASE_CHANGELOG" \
            --arg version_type "$RELEASE_TYPE" \
            '{
              name: ("Blood on the Sharktower " + $version),
              version_number: $version,
              changelog: $changelog,
              dependencies: [],
              game_versions: ["26.3"],
              version_type: $version_type,
              loaders: ["fabric"],
              featured: true,
              status: "listed",
              project_id: $project,
              file_parts: ["pack"],
              primary_file: "pack",
              environment: "client_and_server"
            }')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "User-Agent: gitgudscrub/BloodOnTheSharkTower (GitHub Actions)" \
            --form "data=$DATA;type=application/json" \
            --form "pack=@dist/blood-on-the-sharktower-${RELEASE_VERSION}.mrpack;type=application/x-modrinth-modpack+zip" \
            https://api.modrinth.com/v2/version \
            | tee modrinth-response.json

          echo
          echo "Published Modrinth version:"
          jq '{id, project_id, name, version_number, version_type, status, date_published}' modrinth-response.json
